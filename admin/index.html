<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم متجر الكويت - نظام إدارة متقدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #007A3D;
            --primary-dark: #005a2d;
            --secondary: #CE1126;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--dark);
            color: var(--white);
            padding: 20px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transition: transform 0.3s;
        }
        .sidebar-header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .sidebar-header h2 { font-size: 1.5rem; margin-bottom: 5px; }
        .sidebar-header p { color: #bdc3c7; font-size: 0.9rem; }
        .menu-item {
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .menu-item:hover, .menu-item.active {
            background: var(--primary);
            transform: translateX(-5px);
        }
        .menu-item i { font-size: 1.2rem; width: 25px; }
        .main-content {
            margin-right: 280px;
            padding: 30px;
            min-height: 100vh;
        }
        .top-bar {
            background: var(--white);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 { color: var(--dark); font-size: 1.8rem; }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.2rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: var(--primary);
            opacity: 0.1;
            border-radius: 50%;
            transform: translate(30%, -30%);
        }
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .stat-card h3 { font-size: 2.2rem; color: var(--dark); margin-bottom: 5px; }
        .stat-card p { color: #7f8c8d; font-size: 1rem; }
        .card {
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light);
        }
        .card-header h2 { color: var(--dark); font-size: 1.5rem; }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-warning { background: var(--warning); color: var(--dark); }
        .search-bar {
            position: relative;
            flex: 1;
            max-width: 500px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 2px solid var(--light);
            border-radius: 25px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,122,61,0.1);
        }
        .search-bar i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
        }
        .table-container {
            overflow-x: auto;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        thead {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
        }
        th {
            padding: 18px;
            text-align: right;
            font-weight: 600;
            font-size: 0.95rem;
        }
        th:first-child { border-radius: 10px 0 0 0; }
        th:last-child { border-radius: 0 10px 0 0; }
        td {
            padding: 15px 18px;
            border-bottom: 1px solid var(--light);
        }
        tr:hover { background: #f8f9fa; }
        .product-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        .action-btns {
            display: flex;
            gap: 8px;
        }
        .action-btns button {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: var(--white);
            max-width: 900px;
            margin: 30px auto;
            border-radius: 20px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideDown 0.3s;
        }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header {
            padding: 25px 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-size: 1.6rem; }
        .close {
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .close:hover { transform: rotate(90deg); }
        .modal-body { padding: 30px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--light);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,122,61,0.1);
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .image-upload {
            border: 3px dashed var(--light);
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .image-upload:hover {
            border-color: var(--primary);
            background: rgba(0,122,61,0.05);
        }
        .image-upload i { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .image-preview-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .image-preview-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .image-preview-item .remove {
            position: absolute;
            top: 5px;
            left: 5px;
            background: var(--danger);
            color: var(--white);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        .pagination button {
            padding: 10px 18px;
            border: 2px solid var(--light);
            background: var(--white);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .pagination button:hover, .pagination button.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-select {
            padding: 10px 15px;
            border: 2px solid var(--light);
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .bulk-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--primary);
        }
        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--dark);
            color: var(--white);
            padding: 18px 25px;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            display: none;
            animation: slideUp 0.3s;
            z-index: 3000;
        }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); color: var(--dark); }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .stats-grid { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏪 لوحة تحكم متجر الكويت</h1>
        <p>إدارة المنتجات بسهولة</p>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalProducts">0</h3>
                <p>إجمالي المنتجات</p>
            </div>
            <div class="stat-card">
                <h3 id="totalCategories">0</h3>
                <p>الفئات</p>
            </div>
            <div class="stat-card">
                <h3 id="avgPrice">0</h3>
                <p>متوسط السعر (د.ك)</p>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="openAddModal()">+ إضافة منتج جديد</button>
            <button class="btn btn-success" onclick="saveProducts()">💾 حفظ التغييرات</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج..." onkeyup="filterProducts()">
            </div>
        </div>

        <div class="products-table">
            <table>
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>الاسم</th>
                        <th>الفئة</th>
                        <th>السعر</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="productsBody">
                    <tr><td colspan="5" class="loading">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">إضافة منتج جديد</h2>
            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="form-group">
                    <label>اسم المنتج *</label>
                    <input type="text" id="productTitle" required>
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="productDescription"></textarea>
                </div>
                <div class="form-group">
                    <label>الفئة *</label>
                    <input type="text" id="productCategory" required>
                </div>
                <div class="form-group">
                    <label>السعر العادي (د.ك) *</label>
                    <input type="number" step="0.001" id="productPrice" required>
                </div>
                <div class="form-group">
                    <label>سعر التخفيض (د.ك)</label>
                    <input type="number" step="0.001" id="productSalePrice">
                </div>
                <div class="form-group">
                    <label>رابط الصورة الرئيسية *</label>
                    <input type="url" id="productImage" required>
                </div>
                <div class="form-group">
                    <label>البراند</label>
                    <input type="text" id="productBrand">
                </div>
                <input type="hidden" id="productId">
                <button type="submit" class="btn btn-primary">حفظ المنتج</button>
            </form>
        </div>
    </div>

    <script>
        let products = [];
        let editingIndex = -1;

        // Load products
        async function loadProducts() {
            try {
                const response = await fetch('../data/kuwait-products.json');
                products = await response.json();
                displayProducts();
                updateStats();
            } catch (error) {
                alert('خطأ في تحميل المنتجات!');
            }
        }

        function displayProducts() {
            const tbody = document.getElementById('productsBody');
            tbody.innerHTML = products.map((p, index) => `
                <tr>
                    <td><img src="${p.media?.main_image || ''}" class="product-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23ddd%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'"></td>
                    <td>${p.title}</td>
                    <td>${p.category || '-'}</td>
                    <td>${parseFloat(p.pricing?.regular || 0).toFixed(3)} د.ك</td>
                    <td class="action-btns">
                        <button class="edit-btn" onclick="editProduct(${index})">✏️ تعديل</button>
                        <button class="delete-btn" onclick="deleteProduct(${index})">🗑️ حذف</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalProducts').textContent = products.length;
            const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
            document.getElementById('totalCategories').textContent = categories.length;
            const avgPrice = products.reduce((sum, p) => sum + parseFloat(p.pricing?.regular || 0), 0) / products.length;
            document.getElementById('avgPrice').textContent = avgPrice.toFixed(3);
        }

        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                p.title?.toLowerCase().includes(search) || 
                p.category?.toLowerCase().includes(search)
            );
            const tbody = document.getElementById('productsBody');
            tbody.innerHTML = filtered.map((p, index) => `
                <tr>
                    <td><img src="${p.media?.main_image || ''}" class="product-img"></td>
                    <td>${p.title}</td>
                    <td>${p.category || '-'}</td>
                    <td>${parseFloat(p.pricing?.regular || 0).toFixed(3)} د.ك</td>
                    <td class="action-btns">
                        <button class="edit-btn" onclick="editProduct(${products.indexOf(p)})">✏️ تعديل</button>
                        <button class="delete-btn" onclick="deleteProduct(${products.indexOf(p)})">🗑️ حذف</button>
                    </td>
                </tr>
            `).join('');
        }

        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = 'إضافة منتج جديد';
            document.getElementById('productForm').reset();
            document.getElementById('productModal').style.display = 'block';
        }

        function editProduct(index) {
            editingIndex = index;
            const p = products[index];
            document.getElementById('modalTitle').textContent = 'تعديل المنتج';
            document.getElementById('productTitle').value = p.title || '';
            document.getElementById('productDescription').value = p.description || '';
            document.getElementById('productCategory').value = p.category || '';
            document.getElementById('productPrice').value = p.pricing?.regular || '';
            document.getElementById('productSalePrice').value = p.pricing?.sale || '';
            document.getElementById('productImage').value = p.media?.main_image || '';
            document.getElementById('productBrand').value = p.brand || '';
            document.getElementById('productId').value = p.id || '';
            document.getElementById('productModal').style.display = 'block';
        }

        function deleteProduct(index) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products.splice(index, 1);
                displayProducts();
                updateStats();
                alert('تم الحذف! اضغط "حفظ التغييرات" لتأكيد الحذف.');
            }
        }

        function saveProduct(event) {
            event.preventDefault();
            const product = {
                id: editingIndex === -1 ? Date.now() : products[editingIndex].id,
                title: document.getElementById('productTitle').value,
                description: document.getElementById('productDescription').value,
                category: document.getElementById('productCategory').value,
                brand: document.getElementById('productBrand').value || 'متجر الكويت',
                pricing: {
                    regular: document.getElementById('productPrice').value,
                    sale: document.getElementById('productSalePrice').value || '',
                    currency: 'KWD'
                },
                media: {
                    main_image: document.getElementById('productImage').value,
                    gallery: []
                }
            };

            if (editingIndex === -1) {
                products.push(product);
            } else {
                products[editingIndex] = product;
            }

            displayProducts();
            updateStats();
            closeModal();
            alert('تم الحفظ! اضغط "حفظ التغييرات" لتأكيد التعديلات.');
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        async function saveProducts() {
            const json = JSON.stringify(products, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'kuwait-products.json';
            a.click();
            alert('✅ تم تحميل الملف! استبدل الملف القديم في مجلد data/');
        }

        // Load on start
        loadProducts();
    </script>
</body>
</html>
