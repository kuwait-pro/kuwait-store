name: Inject GTM Everywhere

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Inject Google Tag Manager
        run: |
          GTM_ID="GTM-TQSP4C3D"
          GTM_HEAD="<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','$GTM_ID');</script>"
          GTM_BODY='<noscript><iframe src="https://www.googletagmanager.com/ns.html?id='$GTM_ID'" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>'
          
          find . -name "*.html" -print0 | while IFS= read -r -d '' file; do
            if ! grep -q "$GTM_ID" "$file"; then
              echo "Injecting GTM into $file..."
              sed -i "s~</head>~$GTM_HEAD</head>~g" "$file"
              sed -i "s~<body[^>]*>~& $GTM_BODY~g" "$file"
            else
              echo "Skipping $file (Already injected)"
            fi
          done

      - name: Commit changes
        run: |
          git config --global user.name "GTM Bot"
          git config --global user.email "bot@noreply.com"
          git add .
          git commit -m "Inject GTM-TQSP4C3D" || echo "No changes"
          git push
