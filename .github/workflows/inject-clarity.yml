name: Inject Clarity Everywhere

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-clarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Inject Microsoft Clarity
        run: |
          # كود Clarity (مضغوط عشان ميبوظش الـ sed)
          CLARITY_SCRIPT='<script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", "vdwpvgw5wv");</script>'
          
          # اللف على كل ملفات HTML وحقن الكود قبل قفلة الهيد
          find . -name "*.html" -print0 | while IFS= read -r -d '' file; do
            # التأكد إن الكود مش موجود عشان ميكررش
            if ! grep -q "clarity.ms/tag" "$file"; then
              echo "Injecting Clarity into $file..."
              # الحقن قبل </head>
              sed -i "s~</head>~$CLARITY_SCRIPT</head>~g" "$file"
            else
              echo "Skipping $file (Already injected)"
            fi
          done

      - name: Commit changes
        run: |
          git config --global user.name "Clarity Bot"
          git config --global user.email "bot@noreply.com"
          git add .
          git commit -m "Inject Microsoft Clarity" || echo "No changes to commit"
          git push
